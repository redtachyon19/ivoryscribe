name: Build & release desktop apps

# Builds the macOS (.dmg) and Windows (.exe) installers on cloud runners and
# publishes them to a GitHub Release, so the /download buttons
# (github.com/redtachyon19/ivoryscribe/releases/latest/download/Ivoryscribe-*)
# always serve the newest build. No Cloudflare, no secrets — it uses the
# built-in GITHUB_TOKEN. The repo is public, so Actions minutes + Release
# hosting are free.
#
# TRIGGER: push a version tag — `git tag v0.1.0 && git push origin v0.1.0` — or
# run it from the Actions tab (supply the tag). Each tagged release becomes the
# "latest" release, so the download links auto-update to it.
#
# Builds are UNSIGNED (mac = ad-hoc via after-sign.mjs, win = unsigned NSIS), so
# downloaders get Gatekeeper / SmartScreen warnings until signing is added. That
# does not block the download.
#
# It DOES block auto-update on macOS: Squirrel.Mac validates the incoming build's
# signature against the running app's, and an ad-hoc signature fails that check.
# Mac users will see the update banner and download it fine, then hit an error at
# install. Needs a real Developer ID cert to go the last step. Windows has no such
# requirement and updates end-to-end.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0 (create it first: git tag v0.1.0 && git push origin v0.1.0)"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            asset: Ivoryscribe-arm64.dmg
            glob: frontend/release/*.dmg
          - os: windows-latest
            platform: win
            asset: Ivoryscribe-x64.exe
            glob: frontend/release/*.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # a hung build (e.g. Electron launching instead of packaging) fails fast instead of burning ~6h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Stamp version from the release tag
        working-directory: frontend
        shell: bash
        # electron-builder reads the version from package.json, so the tag has to
        # be written into it or every build ships as 0.0.0.
        run: |
          raw="${{ inputs.tag || github.ref_name }}"
          npm pkg set version="${raw#v}"
          echo "Building version $(npm pkg get version)"

      - name: Build ${{ matrix.platform }} installer
        working-directory: frontend
        # CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from failing the
        # mac build while hunting for a Developer ID cert we don't have yet.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build:electron
          npx electron-builder --${{ matrix.platform }} --publish never

      - name: Collect release assets
        shell: bash
        # Two sets of files go up, and the distinction matters:
        #
        #   1. electron-builder's own output, under the names IT chose. The update
        #      manifests (latest-mac.yml / latest.yml) record those exact filenames
        #      alongside their sha512, so renaming them breaks the updater — it asks
        #      the release for a file that isn't there and 404s. Ship them as-is.
        #   2. A stable-named COPY of the installer, so the website's /download
        #      buttons keep pointing at one fixed URL across releases. The updater
        #      never looks at these; only the manifests do.
        #
        # Globbing by extension deliberately skips release/mac-arm64/ and
        # release/win-unpacked/, which are the multi-hundred-MB unpacked app trees.
        run: |
          mkdir -p staging
          shopt -s nullglob
          for f in frontend/release/*.dmg frontend/release/*.zip frontend/release/*.exe \
                   frontend/release/*.blockmap frontend/release/latest*.yml; do
            cp "$f" staging/
          done
          shopt -u nullglob

          primary="$(ls ${{ matrix.glob }} | head -n1)"
          cp "$primary" "staging/${{ matrix.asset }}"
          echo "Prepared ${{ matrix.asset }} from $primary"

          echo "--- staged for release ---"
          ls -la staging/

          # A missing manifest is the whole bug this step exists to prevent, so fail
          # loudly here rather than shipping another release that can't self-update.
          if ! ls staging/latest*.yml >/dev/null 2>&1; then
            echo "::error::No latest*.yml produced — auto-update would silently break."
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release-assets
          path: staging/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # let GITHUB_TOKEN create the release + upload assets
    steps:
      - name: Download built installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
