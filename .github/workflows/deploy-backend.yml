name: Deploy backend (Railway)

# Builds backend/Dockerfile and deploys it to Railway. Railway injects
# DATABASE_URL from the linked Postgres service (see DEPLOY.md).
#
# Required repo config (Settings → Secrets and variables → Actions):
#   - secret   RAILWAY_TOKEN    : a Railway *project* token
#   - variable RAILWAY_SERVICE  : the backend service name in the project

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy backend
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"
